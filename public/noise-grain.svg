<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.48" numOctaves="3" seed="37" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="2.2" intercept="-0.55"/>
      <feFuncG type="linear" slope="2.2" intercept="-0.55"/>
      <feFuncB type="linear" slope="2.2" intercept="-0.55"/>
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" filter="url(#grain)"/>
</svg>
